---
- name: Semaphore Ansible Local Test
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Check hostname
      ansible.builtin.command:
        cmd: hostname
      register: hostname_result
      changed_when: false

    - name: Check uptime
      ansible.builtin.command:
        cmd: uptime
      register: uptime_result
      changed_when: false

    - name: Display operating system
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_distribution }}"
          - "OS Version: {{ ansible_distribution_version }}"
          - "System: {{ ansible_system }}"
          - "Architecture: {{ ansible_architecture }}"

    - name: Display hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ hostname_result.stdout }}"

    - name: Display uptime
      ansible.builtin.debug:
        msg: "Uptime: {{ uptime_result.stdout }}"

    - name: Check disk usage
      ansible.builtin.command:
        cmd: df -h
      register: disk_result
      changed_when: false

    - name: Display disk usage
      ansible.builtin.debug:
        var: disk_result.stdout_lines

    - name: Check memory on macOS
      ansible.builtin.command:
        cmd: vm_stat
      register: memory_macos_result
      changed_when: false
      when: ansible_system == "Darwin"

    - name: Display macOS memory
      ansible.builtin.debug:
        var: memory_macos_result.stdout_lines
      when: ansible_system == "Darwin"

    - name: Check memory on Linux
      ansible.builtin.command:
        cmd: free -h
      register: memory_linux_result
      changed_when: false
      when: ansible_system == "Linux"

    - name: Display Linux memory
      ansible.builtin.debug:
        var: memory_linux_result.stdout_lines
      when: ansible_system == "Linux"

    - name: Check fstab on Linux
      ansible.builtin.command:
        cmd: cat /etc/fstab
      register: fstab_result
      changed_when: false
      when: ansible_system == "Linux"

    - name: Display fstab
      ansible.builtin.debug:
        var: fstab_result.stdout_lines
      when: ansible_system == "Linux"

    - name: Check running services on Linux
      ansible.builtin.command:
        cmd: systemctl list-units --type=service --state=running --no-legend --no-pager
      register: running_services
      changed_when: false
      failed_when: false
      when: ansible_system == "Linux"

    - name: Display running services
      ansible.builtin.debug:
        var: running_services.stdout_lines
      when: ansible_system == "Linux"

    - name: Check failed services on Linux
      ansible.builtin.command:
        cmd: systemctl --failed --no-legend --no-pager
      register: failed_services
      changed_when: false
      failed_when: false
      when: ansible_system == "Linux"

    - name: Display failed services
      ansible.builtin.debug:
        var: failed_services.stdout_lines
      when: ansible_system == "Linux"

    - name: Test completed
      ansible.builtin.debug:
        msg: "SUCCESS - Semaphore executed the Ansible playbook successfully."
